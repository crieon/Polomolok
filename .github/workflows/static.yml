name: Deploy Static Files

on:
  workflow_dispatch:
  push:
    branches: ["claude/magical-brahmagupta-mcvlwt"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - run: npm install
      
      - run: npm run build
      
      - run: touch build/.nojekyll
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      
      - uses: actions/deploy-pages@v4
        id: deployment
